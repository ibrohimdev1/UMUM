<!-- FLOATING AI CHATBOT WIDGET (Google Gemini Powered) -->

<style>
    /* Floating Launcher Button */
    .ai-fab-container {
        position: fixed;
        bottom: 24px;
        right: 24px;
        z-index: 9998;
    }

    .ai-fab-btn {
        width: 62px;
        height: 62px;
        border-radius: 50%;
        background: linear-gradient(135deg, #0d6efd 0%, #6610f2 100%);
        color: #ffffff;
        border: none;
        outline: none;
        box-shadow: 0 8px 25px rgba(13, 110, 253, 0.45);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 26px;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        position: relative;
    }

    .ai-fab-btn:hover {
        transform: scale(1.1) rotate(5deg);
        box-shadow: 0 12px 30px rgba(13, 110, 253, 0.6);
        color: #ffffff;
    }

    .ai-fab-btn:active {
        transform: scale(0.95);
    }

    /* Pulse effect ring */
    .ai-fab-pulse {
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: rgba(13, 110, 253, 0.4);
        animation: ai-pulse 2s infinite;
        z-index: -1;
    }

    @keyframes ai-pulse {
        0% { transform: scale(0.95); opacity: 0.8; }
        70% { transform: scale(1.4); opacity: 0; }
        100% { transform: scale(1.4); opacity: 0; }
    }

    /* Floating Pill Badge */
    .ai-fab-tooltip {
        position: absolute;
        right: 74px;
        top: 50%;
        transform: translateY(-50%);
        background: #111c2e;
        color: #ffffff;
        padding: 6px 14px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
        box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        opacity: 0;
        visibility: hidden;
        transition: all 0.25s ease;
        pointer-events: none;
    }

    .ai-fab-container:hover .ai-fab-tooltip {
        opacity: 1;
        visibility: visible;
        right: 80px;
    }

    /* Chat Window Container */
    .ai-chat-window {
        position: fixed;
        bottom: 98px;
        right: 24px;
        width: 380px;
        max-width: calc(100vw - 32px);
        height: 520px;
        max-height: calc(100vh - 120px);
        background: #ffffff;
        border-radius: 24px;
        box-shadow: 0 15px 45px rgba(17, 28, 46, 0.22);
        border: 1px solid rgba(0, 0, 0, 0.08);
        z-index: 9999;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        opacity: 0;
        visibility: hidden;
        transform: translateY(20px) scale(0.94);
        transform-origin: bottom right;
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .ai-chat-window.active {
        opacity: 1;
        visibility: visible;
        transform: translateY(0) scale(1);
    }

    /* Header */
    .ai-chat-header {
        background: linear-gradient(135deg, #111c2e 0%, #1a2a44 100%);
        color: #ffffff;
        padding: 16px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .ai-chat-header-title {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .ai-avatar-circle {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: linear-gradient(135deg, #0d6efd 0%, #6610f2 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        color: #ffffff;
        position: relative;
    }

    .ai-online-dot {
        position: absolute;
        bottom: 1px;
        right: 1px;
        width: 10px;
        height: 10px;
        background: #198754;
        border: 2px solid #111c2e;
        border-radius: 50%;
    }

    .ai-header-btn {
        background: transparent;
        border: none;
        color: rgba(255, 255, 255, 0.7);
        font-size: 16px;
        padding: 6px;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.2s;
    }

    .ai-header-btn:hover {
        color: #ffffff;
        background: rgba(255, 255, 255, 0.12);
    }

    /* Chat Messages Body */
    .ai-chat-body {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
        background: #f8fafc;
        display: flex;
        flex-direction: column;
        gap: 12px;
        scroll-behavior: smooth;
    }

    .ai-chat-body::-webkit-scrollbar {
        width: 5px;
    }
    .ai-chat-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 10px;
    }

    .ai-bubble {
        max-width: 84%;
        padding: 12px 16px;
        border-radius: 18px;
        font-size: 0.88rem;
        line-height: 1.45;
        position: relative;
        word-break: break-word;
    }

    .ai-bubble-bot {
        background: #ffffff;
        color: #1e293b;
        border: 1px solid #e2e8f0;
        border-bottom-left-radius: 4px;
        align-self: flex-start;
        box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }

    .ai-bubble-user {
        background: linear-gradient(135deg, #0d6efd 0%, #0b5ed7 100%);
        color: #ffffff;
        border-bottom-right-radius: 4px;
        align-self: flex-end;
        box-shadow: 0 3px 8px rgba(13, 110, 253, 0.25);
    }

    /* Typing Dots Animation */
    .ai-typing-indicator {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 10px 14px;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        border-bottom-left-radius: 4px;
        align-self: flex-start;
        box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }

    .ai-typing-dot {
        width: 7px;
        height: 7px;
        background: #0d6efd;
        border-radius: 50%;
        animation: ai-dot-bounce 1.4s infinite ease-in-out both;
    }

    .ai-typing-dot:nth-child(1) { animation-delay: -0.32s; }
    .ai-typing-dot:nth-child(2) { animation-delay: -0.16s; }
    .ai-typing-dot:nth-child(3) { animation-delay: 0s; }

    @keyframes ai-dot-bounce {
        0%, 80%, 100% { transform: scale(0); }
        40% { transform: scale(1); }
    }

    /* Quick Chips */
    .ai-chips-wrapper {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 4px;
    }

    .ai-chip-btn {
        background: #ffffff;
        border: 1px solid #cbd5e1;
        border-radius: 14px;
        padding: 4px 10px;
        font-size: 11px;
        font-weight: 500;
        color: #334155;
        cursor: pointer;
        transition: all 0.2s;
    }

    .ai-chip-btn:hover {
        background: #e0e7ff;
        border-color: #6366f1;
        color: #4338ca;
    }

    /* Footer / Input Area */
    .ai-chat-footer {
        padding: 12px 14px;
        background: #ffffff;
        border-top: 1px solid #e2e8f0;
    }

    .ai-input-group {
        display: flex;
        align-items: center;
        gap: 8px;
        background: #f1f5f9;
        border-radius: 24px;
        padding: 4px 6px 4px 14px;
        border: 1.5px solid transparent;
        transition: all 0.2s;
    }

    .ai-input-group:focus-within {
        border-color: #0d6efd;
        background: #ffffff;
        box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.15);
    }

    .ai-chat-input {
        flex: 1;
        border: none;
        background: transparent;
        outline: none;
        font-size: 13.5px;
        color: #1e293b;
    }

    .ai-send-btn {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: #0d6efd;
        border: none;
        color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 14px;
        transition: all 0.2s;
    }

    .ai-send-btn:hover {
        background: #0b5ed7;
        transform: scale(1.05);
    }

    .ai-send-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }
</style>

<!-- Floating Launcher Button -->

<!-- Markdown Parser Script -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<script>
    (function() {
        const fabBtn = document.getElementById('aiFabBtn');
        const fabIcon = document.getElementById('aiFabIcon');
        const chatWindow = document.getElementById('aiChatWindow');
        const closeBtn = document.getElementById('aiCloseBtn');
        const clearBtn = document.getElementById('aiClearBtn');
        const chatBody = document.getElementById('aiChatBody');
        const chatForm = document.getElementById('aiChatFloatingForm');
        const inputField = document.getElementById('aiFloatingInput');
        const sendBtn = document.getElementById('aiFloatingSendBtn');

        // Global toggle function (can be called from navbar or buttons)
        window.toggleAIChat = function() {
            const isActive = chatWindow.classList.toggle('active');
            if (isActive) {
                fabIcon.className = 'fas fa-chevron-down';
                setTimeout(() => inputField.focus(), 300);
            } else {
                fabIcon.className = 'fas fa-robot';
            }
        };

        if (fabBtn) {
            fabBtn.addEventListener('click', window.toggleAIChat);
        }

        if (closeBtn) {
            closeBtn.addEventListener('click', function() {
                chatWindow.classList.remove('active');
                fabIcon.className = 'fas fa-robot';
            });
        }

        if (clearBtn) {
            clearBtn.addEventListener('click', function() {
                chatBody.innerHTML = `
                    <div class="ai-bubble ai-bubble-bot">
                        Suhbat tozalandi. Qanday yordam bera olaman? 😊
                    </div>
                `;
            });
        }

        // Quick chips handler
        document.addEventListener('click', function(e) {
            if (e.target && e.target.classList.contains('ai-chip-btn')) {
                const msg = e.target.getAttribute('data-msg');
                if (msg) {
                    inputField.value = msg;
                    chatForm.dispatchEvent(new Event('submit'));
                }
            }
        });

        // Submit form handler
        if (chatForm) {
            chatForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                const userText = inputField.value.trim();
                if (!userText) return;

                // 1. Append User Message
                const userBubble = document.createElement('div');
                userBubble.className = 'ai-bubble ai-bubble-user';
                userBubble.textContent = userText;
                chatBody.appendChild(userBubble);

                inputField.value = '';
                sendBtn.disabled = true;
                chatBody.scrollTop = chatBody.scrollHeight;

                // Remove quick chips after first message
                const chips = document.getElementById('aiQuickChips');
                if (chips) chips.remove();

                // 2. Append Typing Indicator
                const typingDiv = document.createElement('div');
                typingDiv.className = 'ai-typing-indicator';
                typingDiv.id = 'aiTypingIndicator';
                typingDiv.innerHTML = `
                    <div class="ai-typing-dot"></div>
                    <div class="ai-typing-dot"></div>
                    <div class="ai-typing-dot"></div>
                `;
                chatBody.appendChild(typingDiv);
                chatBody.scrollTop = chatBody.scrollHeight;

                try {
                    const response = await fetch('/api/v1/ai/chat/', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': getCookie('csrftoken') || ''
                        },
                        body: JSON.stringify({ message: userText })
                    });

                    const data = await response.json();
                    typingDiv.remove();

                    const botBubble = document.createElement('div');
                    botBubble.className = 'ai-bubble ai-bubble-bot';

                    const replyText = data.reply || "Uzr, javob olishda muammo yuz berdi. Qaytadan urinib ko‘ring.";
                    botBubble.innerHTML = window.marked ? marked.parse(replyText) : replyText;
                    chatBody.appendChild(botBubble);
                } catch (err) {
                    typingDiv.remove();
                    const errBubble = document.createElement('div');
                    errBubble.className = 'ai-bubble ai-bubble-bot text-danger';
                    errBubble.innerHTML = '<i class="fas fa-exclamation-triangle me-1"></i> Tarmoq xatoligi. Qaytadan urinib ko‘ring.';
                    chatBody.appendChild(errBubble);
                } finally {
                    sendBtn.disabled = false;
                    chatBody.scrollTop = chatBody.scrollHeight;
                    inputField.focus();
                }
            });
        }

        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
    })();
</script>
