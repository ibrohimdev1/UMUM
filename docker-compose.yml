version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: umum_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-umum_db}
      POSTGRES_USER: ${DB_USER:-umum_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-umum_secret_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: umum_redis
    restart: always
    ports:
      - "6379:6379"

  web:
    build: .
    container_name: umum_web
    restart: always
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - USE_SQLITE_DEV=False
      - DB_HOST=db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
